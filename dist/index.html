<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CKY Photography</title>
    <meta
      name="description"
      content="A clean desktop-first 3D spiral photography gallery with a space robot guide."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/assets/index-0S8SlwVn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DHAa9yCK.css">
  </head>
  <body class="is-intro">
    <div class="site-shell">
      <div class="ambient ambient--left"></div>
      <div class="ambient ambient--right"></div>
      <div class="grid-fade"></div>

      <div class="cursor" id="cursor" aria-hidden="true">
        <span class="cursor__ring"></span>
        <span class="cursor__core"></span>
        <span class="cursor__halo"></span>
      </div>

      <main class="wheel-page" id="wheelRoot">
        <section class="wheel-stage">
          <canvas
            id="scene"
            class="wheel-stage__canvas"
            aria-label="Interactive 3D ring photography gallery"
          ></canvas>

          <div class="hud">
            <header class="hud__brand">
              <p class="hud__eyebrow">CKY Photography</p>
              <p class="hud__subtitle">
                Drag to spin the ring. Scroll to lift it away and send the astronaut robot falling to the next platform.
              </p>
            </header>

            <div class="hud__speech">
              <h1 class="hud__title" id="heroMessage" data-message="Hi there, welcome to CKY photography!"></h1>
            </div>

            <div class="hud__month-rails" id="monthRails" aria-hidden="true">
              <div class="hud__month-column hud__month-column--left" id="monthColumnLeft"></div>
              <div class="hud__month-column hud__month-column--right" id="monthColumnRight"></div>
            </div>
          </div>
        </section>

        <div class="scroll-rail" id="scrollRail" aria-hidden="true"></div>
      </main>
    </div>

  </body>
</html>
