<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>CKY Photography</title>
    <meta
      name="description"
      content="Photographs by CKY - the Netherlands, Kazakhstan, Switzerland and further - with a small space robot as your guide."
    />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script type="module" crossorigin src="./assets/index-B8YwoyHC.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BM5z5yYa.css">
  </head>
  <body>
    <canvas class="stars" id="stars" aria-hidden="true"></canvas>

    <nav class="topbar" aria-label="Site">
      <a class="topbar__home" href="/">CKY</a>
      <span class="topbar__divider" aria-hidden="true">/</span>
      <span class="topbar__section">Photography</span>
    </nav>

    <header class="hero" id="hero">
      <canvas class="hero__canvas" id="scene" aria-label="A ring of favourite photographs around a small robot. Drag to spin it, click a photo to open it."></canvas>

      <div class="speech" id="speech">
        <p class="speech__text" id="heroMessage" aria-live="polite"></p>
      </div>

      <div class="hero__foot">
        <p class="hero__hint">Drag to spin &middot; click a photo to open it</p>
        <button class="hero__cue" id="scrollCue" type="button">
          <span>All photographs</span>
          <span class="hero__cue-line" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <main class="gallery" id="gallery">
      <header class="gallery__head">
        <h1 class="gallery__title">Photographs</h1>
        <p class="gallery__summary" id="gallerySummary"></p>
      </header>
      <nav class="filters" id="filters" aria-label="Filter by country"></nav>
      <div class="grid" id="grid"></div>
    </main>

    <footer class="foot">
      <p>More frames on the way.</p>
      <a href="/">Back to ckyogeshwar.com</a>
    </footer>

    <div class="cursor" id="cursor" aria-hidden="true">
      <span class="cursor__ring"></span>
      <span class="cursor__core"></span>
    </div>

  </body>
</html>
